services:
  rabbitmq:
    image: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dkp-network

  redis:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - dkp-network

  auth-service:
    build:
      context: ./auth-service/.
    env_file:
      - ./auth-service/.env
    ports:
      - 3000:3000
    depends_on:
      - redis
      - rabbitmq
    networks:
      - dkp-network

  account-service:
    build:
      context: ./account-service/.
    env_file:
      - ./account-service/.env
    ports:
      - 3001:3001
    depends_on:
      - redis
      - rabbitmq
    networks:
      - dkp-network

volumes:
  rabbitmq_data:
  redis_data:

networks:
  dkp-network:
    driver: bridge
