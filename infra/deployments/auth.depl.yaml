apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: collins/auth
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "64Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
  namespace: api
  labels:
    app: auth

spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: auth
